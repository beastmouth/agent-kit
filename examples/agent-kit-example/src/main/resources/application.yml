# =============================================================================
# 示例应用配置
#
# 起服务需要两样东西：MySQL（会话与观测明细）+ Redis（会话锁与会话缓存）。
#
# 硬性约束：本文件（以及全仓库）不出现任何真实密钥、口令、内网地址。
# 所有敏感值一律走环境变量——在本机 export，或写进不入库的启动脚本：
#
#   export MYSQL_HOST=...        # 数据库地址（默认 localhost）
#   export MYSQL_PASSWORD=...    # 数据库口令
#   export REDIS_HOST=...        # Redis 地址（默认 localhost）
#   export REDIS_PASSWORD=...    # Redis 口令
#   export CUSTOM_LLM_BASE_URL=...   # 自定义渠道：厂商地址（OpenAI 兼容）
#   export CUSTOM_LLM_MODEL=...      # 自定义渠道：模型名
#   export CUSTOM_LLM_API_KEY=...    # 自定义渠道：密钥
#   export AGENT_KIT_PROVIDER=custom # 想默认走自定义渠道时再设
#
#   mysql -uroot -p agent_kit_demo < agent-kit-starter/src/main/resources/db/agent-kit-schema.sql
#   mvn -Pexamples -pl examples/agent-kit-example -am spring-boot:run
#
# 模型默认走本机 Ollama；换 DeepSeek 设 provider=deepseek + DEEPSEEK_API_KEY，
# 换任意 OpenAI 兼容网关设 CUSTOM_LLM_* 三个变量 + AGENT_KIT_PROVIDER=custom。
# =============================================================================
server:
  port: 18080

spring:
  application:
    name: agent-kit-example

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/agent_kit_demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

agent-kit:
  # ---------------- 引擎 ----------------
  # legacy     = 自研循环，模型输出 JSON 文本协议（不依赖原生 function calling）
  # agentscope = AgentScope 的 ReAct 循环，工具走原生 tools 字段
  # 两者共用同一份 Agent / Tool / 观测 / 评测，换引擎不改业务代码。
  #
  # 用环境变量切换：AGENT_KIT_ENGINE=agentscope java -jar ...
  # 想验证「没引模块会怎样」：把 pom 里的 agent-kit-agentscope 注释掉再设成 agentscope，
  # 启动会在 Started 之前失败，并直接把该加的依赖片段打出来（EngineGuard 干的）。
  engine: ${AGENT_KIT_ENGINE:agentscope}

  # 只在 engine=agentscope 时生效
  agentscope:
    # 声称「已完成」但本轮零工具调用 → 自动补一轮强制纠正
    write-claim-guard: true
    # 工具调用时前端状态行的文案，不配则显示「正在处理」
    tool-labels:
      todo_add: 记待办
      todo_list: 看待办
      todo_done: 划掉待办
      weather_query: 查天气
      time_now: 看时间
    default-tool-label: 处理

  # ---------------- 模型 ----------------
  # custom = 自定义渠道的用法演示：endpoints 里没有内置实现的键会自动长成同名渠道（OpenAI 兼容）。
  # base-url / model / api-key 全走环境变量，真实值（厂商地址与密钥）不进 git。
  provider: ${AGENT_KIT_PROVIDER:ollama}
  base-url: ${AGENT_KIT_BASE_URL:http://localhost:11434}
  model: ${AGENT_KIT_MODEL:qwen3:8b}
  endpoints:
    custom:
      base-url: ${CUSTOM_LLM_BASE_URL:}
      model: ${CUSTOM_LLM_MODEL:}
      api-key: ${CUSTOM_LLM_API_KEY:}
      think: true
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen3:8b}
      think: false
    deepseek:
      base-url: https://api.deepseek.com
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY:}
  # 最终答复是否流式。关掉后前端「转圈 → 一次全出来」。
  # 什么时候该关：企业内网反向代理把 SSE 缓冲到收完才吐、或网关不认 stream=true 直接 400。
  # 某个渠道单独关：endpoints.<id>.stream: false（见下面的注释）。
  stream: true

  # 意图路由（每轮判断「这句话归谁」）可以单独走便宜渠道，留空 = 跟随本次请求的路由。
  # 这一步只输出一个 JSON、提示词极短，用强模型纯属浪费。
  intent-provider: ""

  # 按业务分流：键名 = RunContext.labels["model.route"] 的值，或 Agent#modelRoute() 的返回值。
  # 业务侧一句 labels.put("model.route","cloud") 就能换个渠道，不用改配置重启。
  # 注意：route 内的 fallback 不继承上面的全局 fallback，不写就是不兜底（理由见文档）。
  routes:
    cloud:
      provider: deepseek
      fallback-provider: ollama
      description: 演示用云端渠道，需要 DEEPSEEK_API_KEY

  temperature: 0.1
  timeout-seconds: 120
  # 单轮最多几步「决策 → 调工具」，示例里有 1~2 步就够
  max-steps: 4
  history-limit: 12
  # 稳定前缀在前的提示词顺序，第二轮起前缀缓存命中率更高
  prompt-order: v2

  # 业务口径：脚手架不内置任何业务词，术语与禁止行为写这里
  extra-instructions: |
    - 没有查到数据就直说「没有查到」，不要用常识补全。
    - 回复保持简短，一件事说完就停。

  # ---------------- 路由 ----------------
  router:
    # 模型判「无关」时的关键词兜底；键名必须与子 Agent 的 name() 一致
    fallback-keywords:
      todo:
        - 待办
        - 记一下
        - 提醒我
        - 做完了
        - 划掉
      weather:
        - 天气
        - 气温
        - 冷不冷
        - 带伞
        - 几点
    # 短句追问的省略信号词，命中即延续上一轮实际处理的子 Agent
    follow-up-words:
      - 继续
      - 还有呢
      - 那
    follow-up-max-length: 10

  # ---------------- 会话 ----------------
  context-cache-enabled: true
  context-cache-ttl-seconds: 1800
  max-sessions-per-owner: 50

  # ---------------- 可观测 ----------------
  obs:
    enabled: true
    preview-chars: 200
    args-chars: 1024
    # 示例把原文也写进 trace，方便对照；生产环境含隐私时应设 false
    trace-io-enabled: true
    trace-io-chars: 8000

# ---------------- 链路导出（OTel → Langfuse） ----------------
# 脚手架只打 span（opentelemetry-api），送出去靠这里的 Micrometer Tracing 桥 + OTLP 导出器。
# 不想接 Langfuse：删掉本块（或 TRACE_ENABLED=false），埋点自动退化为 noop，零开销零请求。
# family 项目同款配方，字段含义见 docs/04-可观测性.md 第 3 节。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  otlp:
    tracing:
      # 默认关：没有 endpoint / 没有 key 时 SDK 不建 exporter，span 不出网。
      # 注意 Authorization 为空时打开开关，每条 trace 都会白跑一次 401——
      # 所以两个变量要么都给、要么都不给。
      export:
        enabled: ${TRACE_ENABLED:false}
      # Langfuse 的 OTLP 端点：{langfuse地址}/api/public/otel/v1/traces
      endpoint: ${LANGFUSE_OTLP_ENDPOINT:}
      headers:
        # base64(pk-lf-...:sk-lf-...)，生成：echo -n "pk-lf-xxx:sk-lf-xxx" | base64
        # 走环境变量，密钥不进 git（这是全仓库的硬性约束）
        Authorization: ${LANGFUSE_AUTH_HEADER:}
        # 不带这个头，Langfuse 会延迟最多 10 分钟才入库，看起来像「没上报」
        x-langfuse-ingestion-version: "4"
  tracing:
    sampling:
      # 1.0 = 全采样，本地排障用；上生产调回 0.1（trace 存储量与采样率线性相关）
      probability: ${TRACE_SAMPLE:1.0}

  # ---------------- 评测 ----------------
  eval:
    # 确定性规则不花钱，打开可以看到每次运行的规则命中情况
    enabled: true
    sample-rate: 0
    judge-enabled: false
    golden-enabled: false

  # ---------------- 记忆 ----------------
  # 示例默认关：打开需要 Milvus 与一个嵌入模型（bge-m3），否则启动即报连接失败。
  # 关掉时 recall 返回空列表、consolidateAsync 直接返回，会话链路完全不受影响。
  memory:
    enabled: ${MEMORY_ENABLED:false}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}/v1
    model: bge-m3
    dimensions: 1024
    milvus-uri: ${MILVUS_URI:http://localhost:19530}
    collection: ai_agent_memory
    top-k: 5
    min-score: 0.35

# 示例自己的配置：分区键。多租户系统从登录态取，不要让客户端传
demo:
  namespace: demo

logging:
  level:
    com.beastmouth.agentkit: INFO
